<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Dutching Time alfa</title>
  <style>
    /* ===== RESET & VARIÁVEIS ===== */
    :root {
      --green: #62ac0d;
      --green-dark: #5bb726;
      --bg: #f7faf7;
      --card: #f9fbfa;
      --border: #ebeae2;
      --text: #111;
      --muted: #acb19a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f8f9;
      color: var(--text);
    }

    /* ===== APP ===== */
    .app {
      width: min(895px, calc(100% - 28px));
      margin: 15px auto 30px;
      padding: 40px 40px 40px;
      background: #f8fff4;
      border: 1px solid #d6edc9;
      border-radius: 24px;
      box-shadow: 0 10px 18px rgba(0, 0, 0, .10);
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e7eee4;
    }

    .logo-img {
      flex-shrink: 0;
    }
    .logo-image {
      display: block;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #f8fff4; /* fallback enquanto a imagem não carrega */
    }

    .title {
      font-size: 16px;
      font-weight: 800;
      flex: 1;
      text-align: center;
      letter-spacing: .3px;
    }

    /* ===== BOTÃO HAMBÚRGUER ===== */
    .menu-toggle {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 6px 4px;
      background: transparent;
      border: none;
      flex-shrink: 0;
    }
    .menu-toggle span {
      display: block;
      width: 26px;
      height: 3px;
      background: #2d3a47;
      border-radius: 3px;
      transition: 0.25s ease;
    }
    .menu-toggle.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    .menu-toggle.active span:nth-child(2) {
      opacity: 0;
    }
    .menu-toggle.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* ===== MENU MOBILE ===== */
    .mobile-menu {
      display: none;
      flex-direction: column;
      background: #fff;
      border: 1px solid #d6edc9;
      border-radius: 12px;
      margin-top: 8px;
      padding: 10px 0;
      box-shadow: 0 6px 12px rgba(0, 0, 0, .08);
    }
    .mobile-menu.open {
      display: flex;
    }
    .mobile-menu ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .mobile-menu li {
      border-bottom: 1px solid #f0f3f2;
    }
    .mobile-menu li:last-child {
      border-bottom: none;
    }
    .mobile-menu a {
      display: block;
      padding: 12px 24px;
      color: #1f2a36;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
      transition: background .15s;
    }
    .mobile-menu a:hover {
      background: #f2faf0;
      color: var(--green-dark);
    }

    /* ===== OUTROS ESTILOS (calculadora) ===== */
    .section-title {
      text-align: center;
      margin: 25px 0 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .3px;
    }
    .money-box {
      width: min(385px, 100%);
      height: 63px;
      margin: 0 auto 16px;
      border: 1px solid #dfe4e8;
      border-radius: 13px;
      background: #fbfcfd;
      display: flex;
      align-items: center;
      padding: 0 15px;
    }
    .currency {
      color: var(--green);
      font-size: 22px;
      font-weight: 800;
    }
    #totalInvestment {
      flex: 1;
      text-align: center;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 18px;
      font-weight: 800;
      min-width: 0;
    }
    .copy {
      border: 0;
      background: transparent;
      color: #aeb6c2;
      font-size: 20px;
      cursor: pointer;
    }
    .quick {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e8eee7;
    }
    .quick button,
    .action {
      background: #fff;
      border: 1px solid #dfe4e8;
      border-radius: 8px;
      height: 45px;
      padding: 0 13px;
      color: #98a3b3;
      font-weight: 700;
      cursor: pointer;
    }
    .quick button:hover,
    .action:hover {
      border-color: #b9c4ce;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .summary-card {
      height: 82px;
      background: #fafbfc;
      border: 1px solid #e8ecef;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .label {
      font-size: 8px;
      font-weight: 800;
      color: #8d98a7;
      margin-bottom: 12px;
    }
    .value {
      font-size: 16px;
      font-weight: 800;
    }
    .green {
      color: var(--green);
    }
    .table-head,
    .row {
      display: grid;
      grid-template-columns: 54px 165px 1fr 1fr 105px 28px;
      align-items: center;
    }
    .table-head {
      min-height: 54px;
      border-bottom: 1px solid #e5e9e7;
      font-size: 10px;
      font-weight: 800;
    }
    .row {
      min-height: 95px;
      border-bottom: 1px solid #e6ebe7;
    }
    .index {
      color: #98a3b3;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
    }
    .odds {
      width: 104px;
      height: 62px;
      border: 1px solid #dce2e7;
      border-radius: 12px;
      background: #fbfcfd;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      outline: none;
    }
    .cell-value {
      font-size: 17px;
      font-weight: 800;
    }
    .delete {
      border: 0;
      background: transparent;
      color: #cfd5db;
      font-size: 21px;
      cursor: pointer;
    }
    .delete:hover {
      color: #aab2bb;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e7eee4;
    }
    .action {
      height: 55px;
      font-size: 11px;
      letter-spacing: .6px;
      font-weight: 800;
    }
    .add {
      color: #111;
    }
    .add span {
      color: var(--green);
      font-size: 22px;
      vertical-align: -2px;
      margin-right: 8px;
    }
    .reset {
      color: #ef493e;
      background: #f0b4b4;
    }
    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 8px 20px;
      font-size: 9px;
      font-weight: 800;
      color: #da484f;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }
    .check input {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid #d9dfe5;
      border-radius: 4px;
      background: #fff;
      position: relative;
    }
    .check input:checked {
      background: var(--green);
      border-color: var(--green);
    }
    .check input:checked:after {
      content: "✓";
      position: absolute;
      color: #fff;
      font-size: 11px;
      left: 3px;
      top: 0;
    }
    .commission-box {
      display: none;
      align-items: center;
      gap: 8px;
      margin-left: 6px;
    }
    .commission-box.show {
      display: flex;
    }
    .commission-box input {
      width: 55px;
      border: 1px solid #dfe4e8;
      border-radius: 6px;
      padding: 5px;
    }
    .history {
      color: #77bd2d;
      cursor: pointer;
    }
    .save {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      font-weight: 900;
      letter-spacing: .4px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(91, 183, 38, .18);
      color: #fff;
      font-size: 16px;
    }
    .save:hover {
      background: #79c52c;
    }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #111;
      color: #fff;
      padding: 12px 16px;
      border-radius: 9px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(10px);
      transition: .2s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: none;
    }

    /* ===== RESPONSIVO ===== */
    @media (max-width: 720px) {
      .app {
        padding: 25px 16px;
      }
      .table-head,
      .row {
        grid-template-columns: 35px 105px 1fr 1fr 55px 22px;
      }
      .table-head {
        font-size: 8px;
      }
      .odds {
        width: 90px;
      }
      .cell-value {
        font-size: 14px;
      }
    }

    @media (max-width: 520px) {
      .summary {
        grid-template-columns: 1fr;
      }
      .summary-card {
        height: 65px;
      }
      .table-head {
        display: none;
      }
      .row {
        grid-template-columns: 30px 95px 1fr 25px;
        gap: 6px;
      }
      .row .return,
      .row .pct {
        display: none;
      }
      .quick {
        gap: 6px;
      }
      .quick button {
        padding: 0 8px;
        font-size: 11px;
      }
      .actions {
        grid-template-columns: 1fr;
      }
      .header .title {
        font-size: 13px;
      }
      .logo-image {
        width: 40px;
        height: 40px;
      }
      .menu-toggle span {
        width: 22px;
        height: 2.5px;
      }
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- ===== HEADER COM LOGO (PNG) E MENU MOBILE ===== -->
    <header class="header">
      <div class="logo-img">
        <!-- 
          ⬇️ SUBSTITUA O src PELO CAMINHO DA SUA IMAGEM PNG 
          Exemplo: src="logo.png" ou src="images/logo.png"
        -->
        <img
          src="logo.png"
          alt="Logo da Calculadora Dutching"
          class="logo-image"
        />
      </div>

      <div class="title">CALCULADORA DUTCHING</div>

      <button class="menu-toggle" id="menuToggle" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <!-- Menu mobile (links direcionados) -->
    <nav class="mobile-menu" id="mobileMenu">
      <ul>
        <li><a href="#home">Início</a></li>
        <li><a href="#sobre">Sobre</a></li>
        <li><a href="#calculadora">Calculadora</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>

    <!-- ===== CONTEÚDO DA CALCULADORA ===== -->
    <div class="section-title">INVESTIMENTO TOTAL</div>
    <div class="money-box">
      <div class="currency">R$</div>
      <input id="totalInvestment" value="100,00" inputmode="decimal" aria-label="Investimento total" />
      <button class="copy" id="copyTotal" title="Copiar valor">▢</button>
    </div>

    <div class="quick">
      <button data-add="-10">- R$ 10</button>
      <button data-add="10">+ R$ 10</button>
      <button data-add="-50">- R$ 50</button>
      <button data-add="50">+ R$ 50</button>
    </div>

    <section class="summary">
      <div class="summary-card"><div class="label">LUCRO</div><div class="value green" id="profit">R$ 0,00</div></div>
      <div class="summary-card"><div class="label">RETORNO</div><div class="value" id="return">R$ 0,00</div></div>
      <div class="summary-card"><div class="label">ROI</div><div class="value green" id="roi">0.00%</div></div>
    </section>

    <div class="table-head">
      <div>#</div><div>ODDS</div><div>INVESTIMENTO</div><div>RETORNO</div><div>% INV.</div><div></div>
    </div>
    <div id="rows"></div>

    <div class="actions">
      <button class="action add" id="addRow"><span>＋</span> ADICIONAR LINHA</button>
      <button class="action reset" id="reset">↻ &nbsp; REINICIAR</button>
    </div>

    <div class="bottom">
      <div style="display:flex;align-items:center;gap:18px">
        <label class="check"><input type="checkbox" id="commission"> COMISSÃO</label>
        <label class="commission-box" id="commissionBox">Taxa <input id="commissionRate" value="0" inputmode="decimal">%</label>
      </div>
      <div class="history" id="history">HISTÓRICO</div>
    </div>

    <button class="save" id="save">SALVAR OPERAÇÃO</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ===== TOGGLE DO MENU MOBILE =====
    const menuToggle = document.getElementById('menuToggle');
    const mobileMenu = document.getElementById('mobileMenu');

    menuToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      this.classList.toggle('active');
      mobileMenu.classList.toggle('open');
    });

    document.querySelectorAll('.mobile-menu a').forEach(link => {
      link.addEventListener('click', () => {
        menuToggle.classList.remove('active');
        mobileMenu.classList.remove('open');
      });
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.header') && !e.target.closest('.mobile-menu')) {
        menuToggle.classList.remove('active');
        mobileMenu.classList.remove('open');
      }
    });

    // ===== CÓDIGO DA CALCULADORA (mantido) =====
    const rowsEl = document.getElementById('rows');
    const totalEl = document.getElementById('totalInvestment');
    const commissionEl = document.getElementById('commission');
    const commissionBox = document.getElementById('commissionBox');
    const commissionRate = document.getElementById('commissionRate');
    let rows = [1, 2, 3];

    const money = n => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(n) || 0);
    const num = v => {
      v = String(v ?? '').trim().replace(/[R$\s]/g, '');
      if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.');
      return parseFloat(v) || 0;
    };
    const fmt = n => Number(n).toFixed(2);

    function render() {
      rowsEl.innerHTML = '';
      rows.forEach((id, i) => {
        const row = document.createElement('div');
        row.className = 'row';
        row.dataset.id = id;
        row.innerHTML = `
          <div class="index">${i + 1}</div>
          <div><input class="odds" type="text" inputmode="decimal" value="0.00" data-id="${id}"></div>
          <div class="cell-value green investment">R$ 0,00</div>
          <div class="cell-value return">R$ 0,00</div>
          <div class="cell-value pct">-</div>
          <button class="delete" data-delete="${id}" title="Excluir">♜</button>`;
        rowsEl.appendChild(row);
      });
      update();
    }

    function update() {
      const total = Math.max(0, num(totalEl.value));
      const oddsEls = [...document.querySelectorAll('.odds')];
      const odds = oddsEls.map(e => num(e.value)).filter(v => v > 0);
      const invSum = odds.reduce((s, o) => s + 1 / o, 0);
      const commission = commissionEl.checked ? Math.max(0, num(commissionRate.value)) / 100 : 0;

      let totalReturn = 0;
      document.querySelectorAll('.row').forEach(row => {
        const input = row.querySelector('.odds');
        const odd = num(input.value);
        const investment = odd > 0 && invSum > 0 ? total * (1 / odd) / invSum : 0;
        const grossReturn = investment * odd;
        const netReturn = grossReturn * (1 - commission);
        totalReturn = Math.max(totalReturn, netReturn);
        row.querySelector('.investment').textContent = money(investment);
        row.querySelector('.return').textContent = money(netReturn);
        row.querySelector('.pct').textContent = total > 0 && investment > 0 ? (investment / total * 100).toFixed(2) + '%' : '-';
      });

      const profit = totalReturn - total;
      const roi = total > 0 ? (profit / total) * 100 : 0;
      document.getElementById('return').textContent = money(totalReturn);
      document.getElementById('profit').textContent = money(profit);
      document.getElementById('roi').textContent = roi.toFixed(2) + '%';
    }

    document.addEventListener('input', e => {
      if (e.target.matches('.odds') || e.target === totalEl || e.target === commissionRate) update();
    });
    document.addEventListener('click', e => {
      const add = e.target.closest('[data-add]');
      if (add) {
        totalEl.value = fmt(Math.max(0, num(totalEl.value) + Number(add.dataset.add))).replace('.', ',');
        update();
      }
      const del = e.target.closest('[data-delete]');
      if (del) {
        if (rows.length <= 1) return;
        rows = rows.filter(id => id !== Number(del.dataset.delete));
        render();
      }
    });
    document.getElementById('addRow').onclick = () => {
      rows.push(Date.now() + Math.random());
      render();
    };
    document.getElementById('reset').onclick = () => {
      rows = [1, 2, 3];
      totalEl.value = '100,00';
      commissionEl.checked = false;
      commissionRate.value = '0';
      commissionBox.classList.remove('show');
      render();
    };
    commissionEl.onchange = () => {
      commissionBox.classList.toggle('show', commissionEl.checked);
      update();
    };
    document.getElementById('copyTotal').onclick = async () => {
      try { await navigator.clipboard.writeText(totalEl.value); showToast('Valor copiado!') } catch { }
    };
    document.getElementById('save').onclick = () => {
      const data = {
        date: new Date().toLocaleString('pt-BR'),
        total: num(totalEl.value),
        commission: commissionEl.checked ? num(commissionRate.value) : 0,
        odds: [...document.querySelectorAll('.odds')].map(e => num(e.value))
      };
      const history = JSON.parse(localStorage.getItem('dutchingHistory') || '[]');
      history.unshift(data);
      localStorage.setItem('dutchingHistory', JSON.stringify(history.slice(0, 50)));
      showToast('Operação salva no histórico!');
    };
    document.getElementById('history').onclick = () => {
      const h = JSON.parse(localStorage.getItem('dutchingHistory') || '[]');
      if (!h.length) { showToast('Nenhuma operação salva.'); return; }
      alert(h.map((x, i) => `${i + 1}. ${x.date} — ${money(x.total)} — Odds: ${x.odds.join(', ')}`).join('\n'));
    };

    function showToast(text) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }
    render();
  </script>

</body>
</html>
